sglang:
  qwen3_0_6b_radix:
    model_path: models/Qwen3-0.6B
    tp_size: 1
    mem_fraction_static: 0.8
    context_length: 4096
    max_running_requests: 8
    chunked_prefill_size: 8192
    enable_radix_cache: true
    enable_cache_report: true
    enable_metrics: true
    enable_cuda_graph: true
    attention_backend: triton
    sampling_backend: pytorch
  qwen3_0_6b_no_radix:
    model_path: models/Qwen3-0.6B
    tp_size: 1
    mem_fraction_static: 0.8
    context_length: 4096
    max_running_requests: 8
    chunked_prefill_size: 8192
    enable_radix_cache: false
    enable_cache_report: true
    enable_metrics: true
    enable_cuda_graph: true
    attention_backend: triton
    sampling_backend: pytorch

workloads:
  shared_prefix_rag:
    requests: 8
    concurrency: 8
    prefix_words: 1500
    output_tokens: 16
  open_qps:
    requests: 24
    concurrency: 8
    target_qps: 4
  prefix_cache_rag:
    contexts: 6
    shared_prefix_tokens: 1024
    final_questions: 4
