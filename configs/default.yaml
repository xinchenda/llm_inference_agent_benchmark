project:
  name: llm_inference_agent_benchmark
  seed: 42

paths:
  corpus: data/corpus
  manifest: data/corpus/source_manifest.json
  index: artifacts/index/knowledge
  questions: data/questions/questions.jsonl
  artifacts: artifacts

llm:
  active_model: qwen3_1_7b_q4
  base_url: http://127.0.0.1:8080/v1
  api_key: local
  request_timeout_s: 120
  max_tokens: 180
  temperature: 0.0
  top_p: 0.8
  context_size: 8192

retrieval:
  chunk_size: 650
  chunk_overlap: 100
  embedding_model: models/bge-small-en-v1.5
  reranker_model: models/ms-marco-MiniLM-L-6-v2
  device: mps
  bm25_k: 20
  vector_k: 20
  rerank_k: 8
  rrf_k: 60
  min_score: 0.005
  default_mode: hybrid_rerank

agent:
  max_steps: 6
  tool_timeout_s: 15
  max_tool_calls: 4
  planner_mode: llm
  planner_timeout_s: 30

service:
  request_timeout_s: 90

eval:
  max_questions: 100
  concurrency: 2
  configurations:
    - direct_qwen3_0_6b_q8
    - direct_qwen3_1_7b_q4
    - direct_qwen3_1_7b_q8
    - rag_vector
    - rag_hybrid
    - rag_hybrid_rerank
    - agent_hybrid_rerank
    - agent_rule_rerank

perf:
  prompt_words: [32, 256, 1024, 4096]
  output_tokens: 64
  concurrency: [1, 2, 4]
  repetitions: 5
  warmup: 2


